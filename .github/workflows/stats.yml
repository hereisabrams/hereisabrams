name: Refresh profile charts

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hereisabrams/github-profile-charts@v1
        with:
          readme: README.md
          stats-token: ${{ secrets.STATS_TOKEN }}
          subtitles: '{"stats":"Public and private contributions, refreshed daily","yearly":"2026: the year sleep became optional","weekday":"Last 365 days · weekends exist, technically","languages":"Weighted by my commits per repo"}'
