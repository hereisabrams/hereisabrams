name: Contribution snake

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2a78d6
            dist/snake-dark.svg?palette=github-dark&color_snake=#3987e5
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: refresh snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
