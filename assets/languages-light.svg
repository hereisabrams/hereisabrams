<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Languages. TypeScript 53.0%, Python 13.1%, CSS 12.7%, HTML 10.2%, JavaScript 9.7%, Other 1.4%">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
  .sub { font-size: 12px; fill: #59636e; }
