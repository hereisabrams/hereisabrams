<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Contributions per year. 2020: 1, 2021: 30, 2022: 728, 2023: 447, 2024: 1244, 2025: 3319, 2026: 10584">
<style>
