<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Languages. JavaScript: 55.1%, TypeScript: 38.5%, Python: 2.9%, CSS: 2.5%, HTML: 0.7%">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #e6edf3; }
  .sub { font-size: 12px; fill: #9198a1; }
  .tick { font-size: 11px; fill: #6e7681; }
  .val { font-size: 12px; font-weight: 600; fill: #e6edf3; }
  .lbl { font-size: 12px; fill: #9198a1; }
  .big { font-size: 28px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.5px; }
  .grow { transform-box: fill-box; transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
  .growx { transform-box: fill-box; transform-origin: left; animation: growx .9s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade .6s ease-out both; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes growx { from { transform: scaleX(0); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .grow, .growx, .fade { animation: none; } }
</style>
